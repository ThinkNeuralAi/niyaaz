# ============================================================================
# Sakshi.AI - Docker Compose
#
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker compose up --build
#
# GPU requirement: NVIDIA Container Toolkit must be installed on the host.
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
# ============================================================================

version: '3.8'

services:

  # --------------------------------------------------------------------------
  # Main application (Flask + SocketIO + YOLO inference)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sakshi-ai:latest
    container_name: sakshi_ai_app
    ports:
      - "5000:5000"
    environment:
      # Database — points to the postgres service, not localhost
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-sakshiai_new}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      # Telegram alerts (leave TELEGRAM_DISABLED=true to silence all notifications)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_DISABLED=${TELEGRAM_DISABLED:-false}
      # RTSP capture options (TCP transport, 5-second timeout)
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=timeout;5000000|rtsp_transport;tcp
    volumes:
      # Persistent runtime data
      - ./data:/app/data
      - ./logs:/app/logs
      # Model files (large — kept on host, mounted read-only)
      - ./models:/app/models:ro
      # Config files (mounted read-write so live edits take effect on restart)
      - ./config:/app/config
      # Snapshot images generated by violation detectors
      - ./static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    # GPU access — remove this section if running CPU-only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - sakshi_network

  # --------------------------------------------------------------------------
  # PostgreSQL database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sakshi_ai_postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-sakshiai_new}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose to host for DBeaver / pgAdmin access during development.
      # Remove this mapping in production if external DB access is not needed.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sakshiai_new}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - sakshi_network

volumes:
  postgres_data:
    driver: local

networks:
  sakshi_network:
    driver: bridge
